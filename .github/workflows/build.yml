name: Build FireRed expansion
# Rebuild testing branch after dev integration (HM Test Lab not yet implemented).

on:
  push:
    branches:
      - main
      - feature/no-hm-slave-testing
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"

concurrency:
  group: build-frlg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-firered:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Verify tool sources
        run: |
          test -d tools/compresSmol
          test -f tools/compresSmol/Makefile

      - name: Build tools serially
        run: make tools -j1

      - name: Build FireRed
        run: make firered -j"$(nproc)" -O

      - name: Upload generation-selection FireRed ROM
        uses: actions/upload-artifact@v4
        with:
          name: firered-no-hm-slave-baseline
          path: pokefirered.gba
          if-no-files-found: error
          retention-days: 14
