name: Build FireRed expansion

on:
  push:
    branches:
      - candidate/frlg-expansion
  pull_request:

concurrency:
  group: build-frlg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-firered:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             binutils-arm-none-eabi             gcc-arm-none-eabi             libnewlib-arm-none-eabi             libpng-dev             python3

      - name: Build FireRed
        run: make firered -j"$(nproc)" -O
