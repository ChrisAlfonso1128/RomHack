name: Build FireRed expansion

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/CODEOWNERS"
      - ".github/PULL_REQUEST_TEMPLATE.md"

concurrency:
  group: build-frlg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-firered:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Verify tool sources
        run: |
          test -d tools/compresSmol
          test -f tools/compresSmol/Makefile

      - name: Build tools serially
        run: make tools -j1

      - name: Build FireRed
        run: make firered -j"$(nproc)" -O
