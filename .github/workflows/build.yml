name: Build decomp

on:
  push:
    branches:
      - main
      - decomp-source
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check out agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Build and install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build FireRed
        run: make -j"$(nproc)"
